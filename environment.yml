name: Gaussians4D
channels:
  - nvidia/label/cuda-11.8.0
  - conda-forge
  - defaults
dependencies:
  - cuda-toolkit
  - plyfile
  - python=3.10
  - pip=23.3.1
  - matplotlib
  - open3d
  - colmap=3.8
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch==2.3.0+cu118
    - torchvision==0.18.0+cu118
    - torchaudio==2.3.0+cu118
    - lpips
    - pytorch-msssim
    - imageio[ffmpeg]
    - opencv-python
